name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator (used by test:rules and test:functions) is a JVM process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # --ignore-scripts: skips postinstall scripts from the full dependency
      # tree so CI doesn't depend on arbitrary ones succeeding (or trust them).
      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Install functions dependencies
        run: npm ci --ignore-scripts
        working-directory: functions

      # sharp is a real, trusted direct dependency (RoomPhotoForeground.test.jsx
      # uses it to render and compare actual pixels) whose native binary only
      # the skipped install script fetches. Rebuild just this one package
      # rather than dropping --ignore-scripts for the whole tree.
      - name: Rebuild sharp's native binary
        run: npm rebuild sharp

      - name: Unit tests (pricing, cart/wishlist, formatters, storage)
        run: npm test

      - name: Firestore security rules tests
        run: npm run test:rules

      - name: Cloud Functions tests (Paystack verification, password reset, tester PINs)
        run: npm run test:functions
