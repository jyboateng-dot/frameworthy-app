name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator (used by test:rules and test:functions) is a JVM process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      # --ignore-scripts: skips @capacitor/assets' sharp postinstall (native image
      # tooling unrelated to running tests) so CI doesn't depend on it succeeding.
      - name: Install app dependencies
        run: npm ci --ignore-scripts

      - name: Install functions dependencies
        run: npm ci --ignore-scripts
        working-directory: functions

      - name: Unit tests (pricing, cart/wishlist, formatters, storage)
        run: npm test

      - name: Firestore security rules tests
        run: npm run test:rules

      - name: Cloud Functions tests (Paystack verification, password reset, tester PINs)
        run: npm run test:functions
