workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true

  ios-simulator-build:
    name: iOS Simulator Build (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true
