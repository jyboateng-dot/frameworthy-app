workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      groups:
        - production
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true

  android-release:
    name: Android Release Build (Play Store AAB)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - production
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      # Manual/tag-triggered only. This produces a signed release bundle for
      # Google Play, so it should not run on every push to master.
      events:
        - tag
      tag_patterns:
        - pattern: 'android-*'
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Set Android app version from release tag
        script: |
          APP_VERSION="${CM_TAG#android-}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "$CM_TAG" ]; then
            echo "Expected a release tag in the form android-1.2.3"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$CM_ENV"
      - name: Decode Android release keystore
        script: |
          if [ -z "$CM_KEYSTORE" ]; then
            echo "CM_KEYSTORE is not set. Add a base64-encoded release keystore to the Codemagic production environment group."
            exit 1
          fi
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android-release.keystore"
          echo "CM_KEYSTORE_PATH=$CM_BUILD_DIR/android-release.keystore" >> "$CM_ENV"
      - name: Build signed Android App Bundle
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true

  ios-simulator-build:
    name: iOS Simulator Build (no signing)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 22
      xcode: latest
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Resolve Swift Package dependencies
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS Release Build (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Name of the App Store Connect API key integration added under
      # Codemagic > Team settings > Integrations > App Store Connect.
      # Must match exactly whatever name is given there.
      app_store_connect: frameworthy_asc
    environment:
      groups:
        - production
      node: 22
      xcode: latest
      cocoapods: default
      # Manually uploaded under Codemagic > Personal account > Code signing
      # identities, rather than fetched/created automatically via the
      # app_store_connect integration above — automatic creation kept
      # failing with "No matching profiles found" with no corresponding
      # certificate or profile ever appearing in Apple Developer Portal, so
      # both were generated by hand (CSR -> certificate -> provisioning
      # profile) and uploaded directly instead.
      ios_signing:
        distribution_type: app_store
        certificates:
          - frameworthy_cert_2026
        provisioning_profiles:
          - frameworthy_profile_2026
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      # Manual/tag-triggered only, unlike android-debug — this submits to
      # TestFlight, so it shouldn't fire on every push to master.
      events:
        - tag
      tag_patterns:
        - pattern: 'ios-*'
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up provisioning profile and export options
        script: xcode-project use-profiles
      - name: Set iOS version and build number from release tag
        script: |
          APP_VERSION="${CM_TAG#ios-}"
          if [ -z "$APP_VERSION" ] || [ "$APP_VERSION" = "$CM_TAG" ]; then
            echo "Expected a release tag in the form ios-1.2.3"
            exit 1
          fi
          cd ios/App
          agvtool new-marketing-version "$APP_VERSION"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true
