workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm install --legacy-peer-deps
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true
