workflows:
  android-debug:
    name: Android Debug Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.frameworthyco.app"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Sync Capacitor Android project
        script: npx cap sync android
      - name: Build Android debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - jyboateng@gmail.com
        notify:
          success: true
          failure: true
