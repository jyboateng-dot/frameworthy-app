<!doctype html>
<html><head><meta charset="UTF-8"><title>Room mask review</title>
<style>
body{margin:0;background:#222;color:white;font:14px system-ui}header{position:sticky;top:0;z-index:10;background:#222;padding:12px;display:flex;gap:12px;align-items:center}select,button{font:inherit;padding:6px}#scene{position:relative;width:min(100%,1100px);aspect-ratio:1.5;isolation:isolate}#scene img,#scene>div,#scene svg{position:absolute;inset:0;width:100%;height:100%;display:block}p{margin:8px 12px}
</style></head><body><header>
<label>Room <select id="room"></select></label>
<label>Wall <select id="color"><option value="#182333">Navy</option><option value="#363636">Charcoal</option><option value="#C46A4A">Terracotta</option><option value="#ffffff">White</option><option value="#879985">Sage</option></select></label>
<label>View <select id="mode"><option value="fixed">Corrected</option><option value="old">Original mask</option><option value="photo">Original photo</option></select></label>
<button id="zoom">Source size</button><button id="mobile">Narrow portrait</button><output id="ready">Loading</output>
</header><p>Local visual check: inspect silhouettes, enclosed openings, plants, transparent glass and skirting. White skirting and beige furniture are intentional.</p><main id="scene"></main>
<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import RoomPhotoForeground from '/src/components/framing/RoomPhotoForeground.jsx';
import { ROOM_SCENES } from '/src/data/roomScenes.js';
const root=createRoot(document.getElementById('scene'));
const roomInput=document.getElementById('room'), colorInput=document.getElementById('color'), modeInput=document.getElementById('mode');
const assets = new Map();
for(const r of ROOM_SCENES){const o=document.createElement('option');o.value=r.id;o.textContent=r.name;roomInput.append(o)}
function render(){
 const selected=ROOM_SCENES.find(r=>r.id===roomInput.value), color=colorInput.value, mode=modeInput.value;
 const room={...selected,image:assets.get(selected.image)?.src || selected.image,wallMaskImage:assets.get(selected.wallMaskImage)?.src || selected.wallMaskImage};
 document.getElementById('ready').textContent='Rendering';
 const ready=()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{document.getElementById('ready').textContent=`Ready: ${room.id} ${color}`}));
 const photo=React.createElement('img',{key:room.image,src:room.image,onLoad:ready});
 const paint=React.createElement('div',{style:{background:color,opacity:color==='#ffffff'?.9:.72,mixBlendMode:color==='#ffffff'?'normal':'multiply'}});
 const foreground=mode==='old'?React.createElement('svg',{viewBox:'0 0 1536 1024',preserveAspectRatio:'none'},React.createElement('defs',null,React.createElement('filter',{id:'invert',colorInterpolationFilters:'sRGB'},React.createElement('feComponentTransfer',null,...['R','G','B'].map(c=>React.createElement('feFunc'+c,{key:c,type:'linear',slope:-1,intercept:1})))),React.createElement('mask',{id:'old',style:{maskType:'luminance'}},React.createElement('image',{href:room.wallMaskImage,width:1536,height:1024,filter:'url(#invert)'}))),React.createElement('image',{href:room.image,width:1536,height:1024,mask:'url(#old)'})):React.createElement(RoomPhotoForeground,{room});
 root.render(React.createElement(React.Fragment,null,photo,mode!=='photo'&&paint,mode!=='photo'&&foreground));
 if(document.querySelector('#scene img')?.getAttribute('src')===room.image) ready();
}
[roomInput,colorInput,modeInput].forEach(el=>el.addEventListener('change',render));
document.getElementById('zoom').onclick=()=>{const scene=document.getElementById('scene');scene.style.height='';scene.style.width=scene.style.width?'':'1536px'};
document.getElementById('mobile').onclick=()=>{const scene=document.getElementById('scene');scene.style.width='390px';scene.style.height='520px'};
// Decode every source/mask before enabling comparisons; never compare a new
// mask over the previous scene while an uncached image is still loading.
roomInput.disabled = true;
await Promise.all(ROOM_SCENES.flatMap(room=>[room.image,room.wallMaskImage]).map(async src=>{
 const blob=await (await fetch(src)).blob();
 const url=await new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.readAsDataURL(blob)});
 const image=new Image(); image.src=url; await image.decode(); assets.set(src,image);
}));
roomInput.disabled = false;
render();
</script></body></html>
